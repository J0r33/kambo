# PR title + template check.
#
# What it enforces, precisely (see AGENTS.md "A gate must not overclaim"):
#   - a PR into `main` must be the `dev -> main` promotion from THIS repo; anything else fails
#   - title matches `type(KAM-xxx): description`
#   - body keeps the five template headings, each as its own line
#   - `## Blast radius` records a real traced commit SHA and at least one checked item
#   - body has at least one checked item overall
# It runs after a PR is opened, so it cannot stop a PR being opened, and it only blocks a
# merge if it is set as a required status check on the ruleset (an operator setting).
# It checks structure, not truth: it cannot tell whether beat 4's checklist was really worked.
# Exempt: the dev -> main promotion from this repo, and dependabot[bot].
name: pr-template-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]

permissions: {}

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: title + template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate PR base, title and body
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          THIS_REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          # GitHub bodies use CRLF; normalise so line anchors work.
          BODY=$(printf '%s' "$BODY" | tr -d '\r')

          # --- Base branch --------------------------------------------------
          # Only the promotion from this repo's own `dev` may target `main`.
          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" = "dev" ] && [ "$HEAD_REPO" = "$THIS_REPO" ]; then
              echo "Exempt: promotion PR (dev -> main)"
              exit 0
            fi
            echo "::error::Only the dev -> main promotion may target main. Retarget this PR onto dev (head: $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi

          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "Exempt: dependabot"
            exit 0
          fi

          fail=0

          # --- Title: type(KAM-xxx): description ---------------------------
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|chore|docs|refactor|test|build|ci|perf|revert|style)\(KAM-[0-9]+\): .+'; then
            echo "::error::PR title must match 'type(KAM-xxx): description', e.g. 'feat(KAM-12): add hero section'. Got: $TITLE"
            fail=1
          fi

          # --- Body: template headings, each on its own line ---------------
          for section in "## Summary" "## Blast radius" "## Testing checklist" "## Data & privacy" "## Docs"; do
            if ! printf '%s\n' "$BODY" | grep -qxF "$section"; then
              echo "::error::PR body is missing the '$section' heading from the PR template (it must be its own line)."
              fail=1
            fi
          done

          # --- Blast radius: a real trace, not the empty template ---------
          # The section runs from its heading to the next "## " heading.
          blast=$(printf '%s\n' "$BODY" | awk '/^## Blast radius$/{f=1;next} /^## /{f=0} f')
          if ! printf '%s\n' "$blast" | grep -qE 'Traced at commit:[[:space:]]*`?[0-9a-f]{7,40}\b'; then
            echo "::error::'## Blast radius' must record 'Traced at commit: <sha>' from beat 4."
            fail=1
          fi
          if ! printf '%s\n' "$blast" | grep -qE '^[[:space:]]*- \[[xX]\]'; then
            echo "::error::'## Blast radius' has no worked checklist item (- [x] ...)."
            fail=1
          fi

          # --- Body: at least one checked item overall --------------------
          if ! printf '%s\n' "$BODY" | grep -qE '^[[:space:]]*- \[[xX]\]'; then
            echo "::error::PR body has no checked checklist items."
            fail=1
          fi

          exit $fail
