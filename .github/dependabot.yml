# Dependabot version updates.
#
# PRs target `dev` because `dev` is this repo's DEFAULT branch. `target-branch` is deliberately
# NOT set: GitHub's docs say that when it is set, the options below stop applying to security
# updates (which always use the default branch). Leaving it unset keeps version and security PRs
# on one config. If the default branch ever changes, revisit this file.
#
# Dependabot PRs are exempt from pr-template-check (dependabot[bot], pr-template-check.yml) and
# carry no KAM ticket. The operator reviews and merges them by hand like any other PR (Gate B);
# the CI check still runs on them.
#
# pnpm (re-checked 2026-09-28 against dependabot-core main @ ca78c14, pnpm_package_manager.rb and
# npm_and_yarn/Dockerfile): Dependabot supports pnpm 7-12, and its updater image ships pnpm 11.x.
# It installs the version pinned in package.json `packageManager` through corepack (pnpm 10.x
# here), and it does not bump `packageManager` itself. The move to pnpm 11 is tracked in KAM-8.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a fresh release settle before proposing it (version updates only; security updates are
    # never delayed).
    #
    # Known hazard on pnpm 10 (KAM-6): Dependabot turns this cooldown into
    # `pnpm update ... --config.minimumReleaseAge=<days x 1440>` when it regenerates the lockfile.
    # pnpm 10 can then fail (ERR_PNPM_NO_MATURE_MATCHING_VERSION) instead of falling back when
    # pnpm-lock.yaml holds, or a package.json range only allows, a version published less than 3
    # days before the run - e.g. right after someone locks fresh packages with `pnpm add`. npm
    # version updates can keep failing until those versions are 3 days old. It clears on its own;
    # the failing job log names the package and its age. Keep package.json range floors on
    # versions older than 3 days. Security updates are not gated this way (dependabot-core passes
    # an age of 0 for them).
    #
    # Deliberately NOT fixed with a repo-level `minimumReleaseAge` in pnpm-workspace.yaml:
    # Dependabot's transitive-dependency update path runs pnpm without an age override, so a repo
    # value would also hold back (or silently downgrade) security fixes for transitive
    # dependencies. The durable fix is pnpm >= 11.3, where Dependabot runs this step with
    # `minimumReleaseAgeStrict=false` and `trustLockfile=true`, so pnpm falls back instead of
    # failing (KAM-8).
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      # next and eslint-config-next are released in lockstep and must stay on the same version.
      nextjs:
        patterns:
          - next
          - eslint-config-next
      # react and react-dom are pinned exactly and must match; their types move with them.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node tracks the Node runtime (engines.node 24.x). A new @types/node major is
      # adopted together with a Node major, deliberately, not by a routine bump.
      # (Applies to version updates; security updates are not filtered by this.)
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
